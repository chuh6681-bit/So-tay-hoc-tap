<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9c9dc">
<title>Sổ tay học tập</title>
<!--
=====================================================================
  SỔ TAY HỌC TẬP  –  1 file HTML (CSS + JavaScript tích hợp)
  Bài thực hành Tin học 12
=====================================================================
  CẤU TRÚC FILE (tìm các mốc "[PHẦN n]" / "3.x" bằng chức năng tìm kiếm):
    [PHẦN 1] CSS        – giao diện. Đổi màu ở :root
    [PHẦN 2] HTML       – khung trang, thanh điều hướng, hướng dẫn
    [PHẦN 3] JavaScript
        3.1 Cấu hình (môn học, khóa lưu trữ, khoảng cách ôn)
        3.2 Hàm tiện ích
        3.3 Dữ liệu, lưu trữ, bản lưu tự động, nâng cấp dữ liệu cũ
        3.4 Bộ đọc câu hỏi và bộ đọc ghi chú dán từ văn bản
        3.5 Điều hướng + Tổng quan
        3.6 Kiến thức (ghi chú)
        3.7 Ôn tập (lịch nhắc, thẻ ghi nhớ, trắc nghiệm nhanh)
        3.8 Luyện đề (làm bài, sổ câu sai, đề đã lưu, ngân hàng, thống kê)
        3.9 Ngữ văn (hồ sơ tác phẩm, kho so sánh)
        3.10 Nhập liệu, sao lưu, đồng bộ, hướng dẫn
        3.11 Xử lý sự kiện + khởi động
  Mẹo sửa: những chỗ có chữ [SỬA] là nơi học sinh có thể tự thay đổi.
=====================================================================
-->
<style>
/* =================== [PHẦN 1] CSS =================== */
/* [SỬA] Đổi bảng màu tại đây: chỉ cần thay mã màu, cả trang sẽ đổi theo */
/* [SỬA] Bảng màu: Hồng kẹo bông + Đỏ garnet + Xanh kaki + Trắng ngà.
   --hong-d = màu chính (đỏ garnet) | --ok = xanh kaki | --kem = trắng ngà | --hong = hồng kẹo bông */
:root{
  --kem:#f6f1ea;        /* nền chính (trắng ngà) */
  --kem2:#ebe3d6;       /* nền phụ */
  --hong:#f9c9dc;       /* hồng kẹo bông */
  --hong2:#fce8f0;      /* hồng rất nhạt */
  --hong-d:#8e2a3c;     /* đỏ garnet (nút chính) */
  --hong-dd:#7a2233;    /* garnet đậm (chữ nhấn) */
  --chu:#3b2a2e;        /* màu chữ chính */
  --chu2:#7d6a62;       /* màu chữ phụ */
  --vien:#e3d6c8;       /* màu viền */
  --ok:#66763f;         /* đúng (xanh kaki) */
  --ok-bg:#e6ebd6;
  --bad:#a3283f;        /* sai */
  --bad-bg:#fbe1e6;
  --sao:#b08a2e;        /* ngôi sao câu khó */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--kem);color:var(--chu);line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
header.top{position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--hong),#f3e3d0);box-shadow:0 2px 10px rgba(142,42,60,.18)}
header.top h1{font-size:1.1rem;margin:0;color:var(--chu)}
header.top small{color:var(--chu2)}
main{max-width:720px;margin:0 auto;padding:14px 14px 96px}
.page{display:none}.page.active{display:block}

/* Thanh điều hướng dưới cùng (dễ bấm bằng ngón cái) */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;
  border-top:1px solid var(--vien);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:7px 2px 5px;font-size:.7rem;color:var(--chu2);min-height:56px;font-family:inherit}
nav.bottom button .ic{display:block;font-size:1.3rem;line-height:1.2}
nav.bottom button.active{color:var(--hong-dd);font-weight:700;background:var(--hong2)}

.card{background:#fff;border:1px solid var(--vien);border-radius:16px;padding:14px;margin-bottom:12px;
  box-shadow:0 2px 8px rgba(232,121,143,.08)}
.card h2,.card h3{margin:0 0 8px;font-size:1.05rem}
.muted{color:var(--chu2);font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Nút bấm: cao tối thiểu 44px để dễ chạm trên điện thoại */
.btn{border:0;border-radius:12px;padding:11px 16px;min-height:44px;font-size:1rem;font-family:inherit;
  background:var(--hong-d);color:#fff;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.block{display:block;width:100%}
.btn.ghost{background:var(--hong2);color:var(--hong-dd)}
.btn.line{background:#fff;color:var(--hong-dd);border:1.5px solid var(--hong)}
.btn.danger{background:var(--bad)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn.on{background:#f3ecd0;color:#6f5a1c;border:1.5px solid var(--sao)}
.btn:disabled{opacity:.5}

input,select,textarea{width:100%;font-size:1rem;font-family:inherit;color:var(--chu);background:var(--kem);
  border:1.5px solid var(--vien);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--hong-d);border-color:var(--hong-d)}
label.f{display:block;font-size:.85rem;color:var(--chu2);margin:8px 0 3px;font-weight:600}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;accent-color:var(--hong-d)}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.95rem}

.tag{display:inline-block;background:var(--hong2);color:var(--hong-dd);border-radius:20px;padding:1px 10px;font-size:.75rem;margin:1px 3px 1px 0}
.tag.star{background:#f3ecd0;color:#6f5a1c}.tag.wr{background:var(--bad-bg);color:var(--bad)}
.big{font-size:2.2rem;font-weight:800;color:var(--hong-dd);line-height:1.1}
.stat{background:var(--hong2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--hong-dd)}
.stat span{font-size:.75rem;color:var(--chu2)}
.bar{height:10px;background:var(--kem2);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hong),var(--hong-d))}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:none;border:1.5px solid var(--hong);background:#fff;color:var(--hong-dd);border-radius:20px;padding:8px 14px;font-size:.9rem;font-family:inherit;min-height:40px}
.tabs button.active{background:var(--hong-d);color:#fff;border-color:var(--hong-d)}

/* Phần làm bài */
.sess-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.timer{font-weight:700;color:var(--hong-dd);font-variant-numeric:tabular-nums}
.pbar{height:6px;background:var(--kem2);border-radius:6px;overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;background:var(--hong-d);transition:width .2s}
.qmeta{font-size:.78rem;color:var(--chu2);margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--kem);color:var(--chu);
  border:1.5px solid var(--vien);border-radius:12px;padding:12px;font-size:1rem;font-family:inherit;min-height:48px}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--hong);color:var(--hong-dd);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.opt.sel{border-color:var(--hong-d);background:var(--hong2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .ltr{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .ltr{background:var(--bad);color:#fff}
.fb{padding:10px 12px;border-radius:10px;margin-top:12px;font-weight:700}
.fb.okbox{background:var(--ok-bg);color:var(--ok)}.fb.badbox{background:var(--bad-bg);color:var(--bad)}
.explain{margin-top:8px;padding:10px 12px;background:#f4f1df;border-left:4px solid var(--sao);border-radius:8px;white-space:pre-wrap;font-size:.95rem}
.navrow{display:flex;gap:8px;margin-top:12px}.navrow .btn{flex:1}
.qgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.qgrid button{min-height:40px;border:1.5px solid var(--vien);background:#fff;border-radius:10px;font-family:inherit;font-size:.9rem}
.qgrid button.done{background:var(--hong);border-color:var(--hong-d)}
.qgrid button.cur{outline:2px solid var(--hong-dd)}

/* Ngân hàng câu hỏi */
.qi-head{cursor:pointer}.qi-text{font-weight:600;white-space:pre-wrap}
.qi-body{margin-top:8px;border-top:1px dashed var(--vien);padding-top:8px;font-size:.93rem}
.qi-body .a{color:var(--ok);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.bars div{flex:1;text-align:center;font-size:.7rem;color:var(--chu2)}
.bars i{display:block;width:100%;background:var(--hong-d);border-radius:6px 6px 0 0;min-height:2px}

/* Hộp thoại sửa câu hỏi và thông báo nhỏ */
.modal{position:fixed;inset:0;background:rgba(74,47,58,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--kem);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--chu);color:#fff;padding:10px 16px;
  border-radius:20px;font-size:.9rem;z-index:60;display:none;max-width:90vw;text-align:center}
pre{background:#fff;border:1px solid var(--vien);border-radius:10px;padding:10px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap;word-break:break-word}
details{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:10px 12px;margin-bottom:8px}
details summary{font-weight:700;color:var(--hong-dd);cursor:pointer;min-height:28px}
details p,details li{font-size:.93rem}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t td,table.t th{border:1px solid var(--vien);padding:6px;text-align:left;vertical-align:top}
.warn{background:#f3ecd0;border-radius:10px;padding:10px;font-size:.9rem}

/* ===== Phần bổ sung cho Sổ tay học tập ===== */
nav.bottom button{font-size:.64rem;padding:7px 0 5px}
nav.bottom button .ic{font-size:1.2rem}
.subj{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subj button{text-align:left;background:#fff;border:1px solid var(--vien);border-radius:14px;padding:10px;font-family:inherit;color:var(--chu);min-height:72px}
.subj button b{display:block;font-size:.95rem}
.subj button span{font-size:.75rem;color:var(--chu2)}
.grp{margin:14px 0 6px;font-size:.95rem;color:var(--hong-dd);border-bottom:2px solid var(--hong);padding-bottom:3px}
.grp small{color:var(--chu2);font-weight:400}
.lvl{display:flex;gap:4px;margin:8px 0}
.lvl button{flex:1;border:1.5px solid var(--hong);background:#fff;color:var(--hong-dd);border-radius:10px;padding:6px 0;font-family:inherit;font-size:.82rem;min-height:36px}
.lvl button.active{background:var(--hong-d);color:#fff;border-color:var(--hong-d)}
.nt{white-space:pre-wrap;margin:6px 0;font-size:.95rem}
.nt .lb{display:block;font-size:.75rem;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.03em}
.nt.tip{background:#eef2e1;border-left:4px solid var(--ok);border-radius:8px;padding:8px 10px}
.nt.mis{background:var(--bad-bg);border-left:4px solid var(--bad);border-radius:8px;padding:8px 10px}
.nt.sam{background:var(--hong2);border-radius:8px;padding:8px 10px}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flash .ft{font-size:1.3rem;font-weight:800;color:var(--hong-dd)}
.flash .bk{text-align:left}
.cmp{width:100%;border-collapse:collapse;font-size:.82rem;display:block;overflow-x:auto}
.cmp th,.cmp td{border:1px solid var(--vien);padding:6px;vertical-align:top;min-width:120px;white-space:pre-wrap;text-align:left}
.cmp th{background:var(--hong2);color:var(--hong-dd)}
.cmp td:first-child,.cmp th:first-child{min-width:78px;font-weight:700;background:var(--kem2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--hong2);color:var(--hong-dd);border-radius:20px;padding:2px 10px;font-size:.8rem}
.due{border-left:5px solid var(--hong-d)}
.hr{border:0;border-top:1px dashed var(--vien);margin:10px 0}
</style>
</head>
<body>

<!-- =================== [PHẦN 2] HTML: khung trang =================== -->
<header class="top">
  <div style="font-size:1.6rem">🌸</div>
  <div><h1>Sổ tay học tập</h1><small id="hdr-sub">Học đều mỗi ngày nhé!</small></div>
</header>

<main>
  <section id="page-home" class="page"></section>
  <section id="page-notes" class="page"></section>
  <section id="page-review" class="page"></section>
  <section id="page-study" class="page"></section>
  <section id="page-lit" class="page"></section>
  <section id="page-tools" class="page"></section>
</main>

<!-- Thanh điều hướng: data-p là tên trang (khớp với PAGES trong JavaScript) -->
<nav class="bottom">
  <button data-act="nav" data-p="home"><span class="ic">🏠</span>Tổng quan</button>
  <button data-act="nav" data-p="notes"><span class="ic">📒</span>Kiến thức</button>
  <button data-act="nav" data-p="review"><span class="ic">🧠</span>Ôn tập</button>
  <button data-act="nav" data-p="study"><span class="ic">✏️</span>Luyện đề</button>
  <button data-act="nav" data-p="lit"><span class="ic">📖</span>Ngữ văn</button>
  <button data-act="nav" data-p="tools"><span class="ic">⚙️</span>Thêm</button>
</nav>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<noscript><p style="padding:20px">Trang này cần bật JavaScript để hoạt động.</p></noscript>

<!-- Hướng dẫn: để trong thẻ template cho dễ chỉnh sửa -->
<template id="tpl-guide">
  <details open><summary>1. Bắt đầu nhanh</summary>
    <ol>
      <li><b>Kiến thức</b>: bấm ＋ để viết ghi chú, hoặc <b>Dán nhanh</b> một đoạn chữ.</li>
      <li><b>Ôn tập</b>: mỗi ngày mở xem "Lịch ôn hôm nay", lật thẻ ghi nhớ rồi bấm Nhớ / Quên.</li>
      <li><b>Luyện đề</b>: làm trắc nghiệm theo môn/chương/bài. Câu sai tự vào <b>Sổ câu sai</b>.</li>
      <li>Mỗi tuần vào <b>Thêm → Sao lưu</b> để tải file dự phòng.</li>
    </ol>
    <p class="muted">Dữ liệu tự lưu trong trình duyệt của máy, không cần mạng.</p>
  </details>
  <details><summary>2. Ghi chú kiến thức và 3 mức chi tiết</summary>
    <ul>
      <li>Mỗi ghi chú có: <b>tóm tắt, ví dụ, mẹo, lỗi sai hay gặp, bài tập mẫu, lời giải</b>.</li>
      <li>Mỗi ghi chú có nút <b>Gọn / Vừa / Đầy đủ</b>: Gọn = tóm tắt; Vừa = + ví dụ + mẹo; Đầy đủ = + lỗi sai + bài tập + lời giải. Máy nhớ mức bạn chọn cho từng ghi chú.</li>
      <li>Xem theo <b>Chương trình</b> (chương → bài) hoặc theo <b>Dạng bài</b>. Ô tìm kiếm tìm cả ghi chú, câu hỏi và tác phẩm (không cần gõ dấu).</li>
    </ul>
  </details>
  <details><summary>3. Mẫu ghi chú thông minh (dán nhiều ghi chú một lúc)</summary>
<pre>#Môn: Hóa học
#Chương: Este - Lipit
#Bài: Este
#Dạng: Viết đồng phân

## Cách gọi tên este
Tóm tắt: Tên gốc ancol + tên gốc axit đuôi "at".
Ví dụ: CH3COOC2H5 = etyl axetat.
Mẹo: Đọc từ phải sang trái của công thức.
Lỗi sai: Nhầm chiều gốc axit và gốc ancol.
Bài tập: Gọi tên HCOOCH3.
Lời giải: Metyl fomat.

## Ghi chú tiếp theo
Tóm tắt: ...</pre>
    <ul>
      <li><code>#Môn</code> <code>#Chương</code> <code>#Bài</code> <code>#Dạng</code> áp dụng cho các ghi chú phía dưới.</li>
      <li>Mỗi ghi chú bắt đầu bằng <code>## Tiêu đề</code>. Nhãn không bắt buộc, thiếu nhãn nào cũng được.</li>
      <li><b>Dán nhanh</b> (trong Kiến thức): dán chữ bất kỳ, dòng đầu là tiêu đề, phần còn lại thành tóm tắt.</li>
      <li>Ghi chú xuất ra file .txt ở mục Sao lưu dùng đúng mẫu này, dán lại được.</li>
    </ul>
  </details>
  <details><summary>4. Mẫu dán câu hỏi trắc nghiệm</summary>
<pre>#Môn: Tin học
#Chương: Chủ đề 4 - Cơ sở dữ liệu
#Bài: Khóa chính

Câu 1. Khóa chính dùng để làm gì?
A. Sắp xếp bảng
B. Xác định duy nhất mỗi bản ghi
C. Xóa bản ghi
D. Đổi tên bảng
Đáp án: B
Giải thích: Khóa chính không trùng và không để trống.</pre>
    <ul>
      <li>Đáp án đúng: dòng <b>Đáp án: B</b>, hoặc dòng <code>*B</code>, hoặc dấu * trước đáp án đúng.</li>
      <li>Vào <b>Thêm → Nhập liệu</b>, chọn "Câu hỏi" hoặc "Ghi chú", bấm Xem trước rồi Thêm. Câu/ghi chú trùng tự bị bỏ qua.</li>
      <li>File .json sao lưu cũ vẫn khôi phục được bình thường.</li>
    </ul>
  </details>
  <details><summary>5. Ôn tập: nhắc lịch, thẻ ghi nhớ, trắc nghiệm nhanh</summary>
    <ul>
      <li>Ghi chú mới đến hạn ôn ngay hôm nay. Bấm <b>Nhớ</b> thì lần ôn tiếp theo cách xa hơn (1 → 3 → 7 → 14 → 30 → 60 ngày). Bấm <b>Quên</b> thì quay lại 1 ngày.</li>
      <li><b>Trắc nghiệm nhanh</b>: 5–10 câu, ưu tiên câu sai và câu khó.</li>
    </ul>
  </details>
  <details><summary>6. Luyện đề, sổ câu sai, tạo đề từ kho</summary>
    <ul>
      <li><b>Luyện tập</b> biết đúng sai ngay; <b>Kiểm tra</b> chấm khi nộp, thang 10, có đếm giờ; <b>Ôn câu sai</b> tự gom các câu đang sai thành một đề.</li>
      <li>Khi sai, chọn <b>lý do</b> và ghi chú ngay dưới đáp án. Xem lại ở tab <b>Sổ câu sai</b>.</li>

<script>
/* =================== [PHẦN 3] JAVASCRIPT =================== */
(function(){
'use strict'; // chế độ nghiêm ngặt: giúp phát hiện lỗi gõ sai tên biến

/* ---------- 3.1 CẤU HÌNH ---------- */
/* [SỬA] Danh sách môn học. Thêm môn mới: thêm 1 dòng {id:'Tên môn', icon:'😀'} */
const SUBJECTS=[
  {id:'Hóa học',icon:'🧪'},{id:'Toán học',icon:'📐'},{id:'Vật lí',icon:'⚛️'},{id:'Ngữ văn',icon:'📖'},
  {id:'Tiếng Anh',icon:'🔤'},{id:'Lịch sử',icon:'🏛️'},{id:'Tin học',icon:'💻'},{id:'Môn khác',icon:'📝'}
];
const STORE_KEY='sotay_hoc_tap_v2';      // ô lưu chính trong localStorage
const OLD_KEY='onthi_giuaky_v1';         // ô lưu của bản cũ: nếu có sẽ tự nâng cấp
const SNAP_KEY='sotay_snapshots_v1';     // ô lưu các bản lưu tự động
const SNAP_MAX=3;                        /* [SỬA] số bản lưu tự động giữ lại */
const INTERVALS=[1,3,7,14,30,60];        /* [SỬA] số ngày chờ giữa các lần ôn (Nhớ càng nhiều lần, càng xa) */
const REASONS=['Nhầm kiến thức','Đọc sai đề','Tính sai','Không nhớ','Đoán bừa','Khác']; /* [SỬA] lý do làm sai */
const LEVELS={gon:'Gọn',vua:'Vừa',full:'Đầy đủ'};
const PAGES=['home','notes','review','study','lit','tools'];
const MODE_LABEL={practice:'Luyện tập',test:'Kiểm tra',retry:'Ôn câu sai'};
const SRC_LABEL={all:'Tất cả',new:'Chưa làm',wrong:'Câu sai',hard:'Câu khó'};

/* ---------- 3.2 HÀM TIỆN ÍCH ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
/* esc: chống chèn mã HTML độc hại khi hiển thị chữ do người dùng nhập */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* fold: bỏ dấu tiếng Việt, chữ thường -> tìm "toan" ra được "Toán" */
const fold=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return dstr(new Date());}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return dstr(d);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;} // trộn Fisher-Yates
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n)+'…':s;}
function fmtDate(t){const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function mmss(sec){sec=Math.max(0,sec);return pad(Math.floor(sec/60))+':'+pad(sec%60);}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.display='none';},2800);}
function subjIcon(id){const s=SUBJECTS.find(x=>x.id===id);return s?s.icon:'📝';}
function subjOptions(val,allLabel){
  return (allLabel?'<option value="">'+allLabel+'</option>':'')+
    SUBJECTS.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===val?' selected':'')+'>'+s.icon+' '+esc(s.id)+'</option>').join('');
}
function listOptions(items,val,allLabel){
  return (allLabel?'<option value="">'+allLabel+'</option>':'')+
    items.map(x=>'<option value="'+esc(x)+'"'+(x===val?' selected':'')+'>'+esc(x)+'</option>').join('');
}
const uniqSorted=a=>Array.from(new Set(a.filter(Boolean))).sort((x,y)=>x.localeCompare(y,'vi',{numeric:true}));
function chaptersOf(subject){return uniqSorted(db.questions.filter(q=>!subject||q.subject===subject).map(q=>q.chapter));}
function lessonsOf(subject,chapter){return uniqSorted(db.questions.filter(q=>(!subject||q.subject===subject)&&(!chapter||q.chapter===chapter)).map(q=>q.lesson));}
function download(name,text,type){
  const blob=new Blob([text],{type:type||'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej();}catch(e){rej(e);}ta.remove();});
}

/* ---------- 3.3 DỮ LIỆU, LƯU TRỮ, BẢN LƯU TỰ ĐỘNG ---------- */
/* db là "kho dữ liệu" duy nhất:
   questions (câu hỏi) | notes (ghi chú kiến thức) | works (tác phẩm Ngữ văn) | compares (kho so sánh)
   exams (đề đã lưu) | history, daily (thống kê) | settings (cài đặt) */
let db=null;
function emptyDb(){return {version:2,questions:[],notes:[],works:[],compares:[],exams:[],history:[],daily:{},
  settings:{examName:'Thi giữa kỳ',examDate:'',syncUrl:'',syncKey:'',lastBackup:0}};}
const S_=v=>String(v==null?'':v).trim();

/* cleanQ: kiểm tra và "làm sạch" 1 câu hỏi. Trả về null nếu sai. (reason, note = lý do và ghi chú khi làm sai) */
function cleanQ(o){
  if(!o||typeof o.text!=='string'||!Array.isArray(o.options))return null;
  let opts=o.options.map(x=>String(x==null?'':x).trim());
  while(opts.length&&!opts[opts.length-1])opts.pop();
  if(opts.length<2||opts.length>4||opts.some(x=>!x))return null;
  const ans=parseInt(o.answer,10);
  if(!(ans>=0&&ans<opts.length))return null;
  if(!o.text.trim())return null;
  return {id:o.id||uid(),subject:o.subject||'Môn khác',chapter:S_(o.chapter)||'Chung',lesson:S_(o.lesson),
    text:o.text.trim(),options:opts,answer:ans,explain:S_(o.explain),
    hard:!!o.hard,wrong:!!o.wrong,right:o.right|0,wrongCount:o.wrongCount|0,last:o.last|0,
    reason:S_(o.reason),note:S_(o.note)};
}
/* cleanNote: làm sạch 1 ghi chú kiến thức. srs = lịch ôn (box: bậc nhớ, due: ngày cần ôn) */
function cleanNote(o){
  if(!o||!S_(o.title))return null;
  const s=o.srs||{};
  return {id:o.id||uid(),subject:o.subject||'Môn khác',chapter:S_(o.chapter)||'Chung',lesson:S_(o.lesson),type:S_(o.type),
    title:S_(o.title),summary:S_(o.summary),example:S_(o.example),tip:S_(o.tip),mistake:S_(o.mistake),
    sample:S_(o.sample),solution:S_(o.solution),tags:S_(o.tags),
    level:LEVELS[o.level]?o.level:'vua',created:o.created|0||Date.now(),
    srs:{box:Math.min(INTERVALS.length-1,Math.max(0,s.box|0)),due:/^\d{4}-\d\d-\d\d$/.test(s.due)?s.due:todayStr(),last:s.last|0}};
}
const WORK_F=['title','author','period','genre','theme','summary','chars','art','quote','link'];
function cleanWork(o){
  if(!o||!S_(o.title))return null;
  const w={id:o.id||uid()};WORK_F.forEach(k=>{w[k]=S_(o[k]);});return w;
}
function cleanCmp(o){
  if(!o||!S_(o.title))return null;
  return {id:o.id||uid(),title:S_(o.title),ids:Array.isArray(o.ids)?o.ids.map(String).slice(0,4):[],note:S_(o.note)};
}
function cleanExam(o){
  if(!o||!S_(o.name)||!Array.isArray(o.ids))return null;
  return {id:o.id||uid(),name:S_(o.name),ids:o.ids.map(String),created:o.created|0||Date.now()};
}
const arr=(d,k)=>Array.isArray(d[k])?d[k]:[];
function normalizeDb(d){
  const base=emptyDb();
  if(!d||typeof d!=='object')return base;
  Object.assign(base.settings,d.settings||{});
  base.questions=arr(d,'questions').map(cleanQ).filter(Boolean);
  base.notes=arr(d,'notes').map(cleanNote).filter(Boolean);
  base.works=arr(d,'works').map(cleanWork).filter(Boolean);
  base.compares=arr(d,'compares').map(cleanCmp).filter(Boolean);
  base.exams=arr(d,'exams').map(cleanExam).filter(Boolean);
  base.history=arr(d,'history').slice(-100);
  base.daily=(d.daily&&typeof d.daily==='object')?d.daily:{};
  return base;
}
function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(db));}
  catch(e){toast('⚠️ Không lưu được. Hãy tải file sao lưu ngay!');}
}
/* Bản lưu tự động (snapshot): giữ SNAP_MAX bản gần nhất, lưu riêng với dữ liệu chính */
function getSnaps(){try{const a=JSON.parse(localStorage.getItem(SNAP_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function snapshot(why){
  try{
    let a=getSnaps();
    a.push({t:Date.now(),why:why,q:db.questions.length,n:db.notes.length,data:JSON.stringify(db)});
    a=a.slice(-SNAP_MAX);
    try{localStorage.setItem(SNAP_KEY,JSON.stringify(a));}
    catch(e){localStorage.setItem(SNAP_KEY,JSON.stringify(a.slice(-1)));}   // hết chỗ: chỉ giữ bản mới nhất
    return true;
  }catch(e){return false;}
}
function hasContent(){return db.questions.length+db.notes.length+db.works.length>0;}
function load(){
  let raw=null,fromOld=false;
  try{raw=localStorage.getItem(STORE_KEY);if(!raw){raw=localStorage.getItem(OLD_KEY);fromOld=!!raw;}}catch(e){}
  if(raw){
    try{
      db=normalizeDb(JSON.parse(raw));
      if(fromOld){snapshot('nâng cấp từ bản cũ');save();}
      else{const s=getSnaps(),last=s.length?s[s.length-1].t:0;
        if(hasContent()&&Date.now()-last>20*3600*1000)snapshot('tự động mỗi ngày');}
      return;
    }catch(e){}
  }
  db=emptyDb();                                      // lần đầu: nạp dữ liệu mẫu để xem thử
  db.questions=parseQuestions(SAMPLE_TEXT,{}).out;
  db.notes=parseNotes(SAMPLE_NOTES,{}).out;
  db.works=[cleanWork(SAMPLE_WORK)];
  save();
}
const qKey=q=>fold(q.subject)+'|'+fold(q.text).replace(/\s+/g,' ');
const nKey=n=>fold(n.subject)+'|'+fold(n.title);
/* addQuestions / addNotes: thêm vào kho, bỏ qua mục trùng */
function addUnique(list,target,keyFn){
  const keys=new Set(target.map(keyFn));let add=0,dup=0;
  list.forEach(x=>{const k=keyFn(x);if(keys.has(k)){dup++;return;}keys.add(k);target.push(x);add++;});
  save();return {add:add,dup:dup};
}
const addQuestions=l=>addUnique(l,db.questions,qKey);
const addNotes=l=>addUnique(l,db.notes,nKey);
function dayRec(){const k=todayStr();if(!db.daily[k])db.daily[k]={done:0,correct:0};return db.daily[k];}
/* recordAnswer: ghi kết quả 1 lần trả lời vào câu hỏi và thống kê ngày */
function recordAnswer(q,correct,mode){
  q.last=Date.now();const d=dayRec();d.done++;
  if(correct){q.right=(q.right||0)+1;d.correct++;if(mode==='retry')q.wrong=false;} // làm đúng khi ôn lại -> gỡ khỏi danh sách sai
  else{q.wrongCount=(q.wrongCount||0)+1;q.wrong=true;}
  save();
}
/* srsRate: cập nhật lịch ôn của ghi chú. good=true (Nhớ) -> lên 1 bậc; false (Quên) -> về bậc 0 */
function srsRate(n,good){
  const box=good?Math.min(INTERVALS.length-1,(n.srs.box|0)+1):0;
  n.srs={box:box,due:addDays(INTERVALS[box]),last:Date.now()};
  save();
}
const dueNotes=()=>{const t=todayStr();return db.notes.filter(n=>!n.srs.due||n.srs.due<=t);};

/* ---------- 3.4 BỘ ĐỌC CÂU HỎI / GHI CHÚ DÁN TỪ VĂN BẢN ---------- */
const SAMPLE_TEXT=`#Môn: Tin học
#Chương: Chủ đề 4 - Giới thiệu các hệ cơ sở dữ liệu
#Bài: Cơ sở dữ liệu quan hệ

Câu 1. Trong cơ sở dữ liệu quan hệ, khóa chính của một bảng dùng để làm gì?
A. Sắp xếp các bản ghi theo thứ tự chữ cái
B. Xác định duy nhất mỗi bản ghi trong bảng
C. Xóa các bản ghi trùng nhau
D. Đổi tên các trường của bảng

/* matchSubject: đoán môn học từ chữ người dùng gõ ở dòng #Môn */
function matchSubject(s){
  const f=fold(s);
  const m=SUBJECTS.find(x=>fold(x.id)===f)||SUBJECTS.find(x=>f&&(fold(x.id).indexOf(f)>=0||f.indexOf(fold(x.id))>=0));
  return m?m.id:'Môn khác';
}
/* parseQuestions: đọc văn bản -> {out: danh sách câu hợp lệ, errs: danh sách lỗi}
   Đọc từng dòng, dùng "chế độ" mode để biết dòng thường đang thuộc phần nào:
   'q' = đề bài, 'opt' = đáp án, 'ans' = đã có dòng Đáp án, 'exp' = giải thích */
function parseQuestions(raw,def){
  const lines=String(raw).replace(/\r/g,'').split('\n');
  const out=[],errs=[];
  const ctx={subject:def.subject||'Môn khác',chapter:def.chapter||'Chung',lesson:def.lesson||''};
  let cur=null,mode='',seen=0;
  /* [SỬA] Các mẫu nhận dạng dòng (biểu thức chính quy). Muốn đổi cách gõ thì sửa ở đây */
  const reHead=/^\s*#\s*(môn|mon|chương|chuong|bài|bai)\s*[:：]\s*(.*)$/i;
  const reQ=/^\s*(?:câu(?:\s*hỏi)?|cau(?:\s*hoi)?)?\s*(\d{1,4})\s*[.):：]\s*(.*)$/i;
  const reOpt=/^\s*(\*?)\s*([A-Da-d])\s*[.):]\s*(.*)$/;
  const reAns=/^\s*(?:đáp án|dap an|đ\/a|đáp số|answer|ans)\s*(?:đúng)?\s*[:：.\-]?\s*([A-Da-d])\b/i;
  const reExp=/^\s*(?:giải thích|lời giải|hướng dẫn giải|giai thich|explain|explanation)\s*[:：]\s*(.*)$/i;

  function flush(){
    if(!cur)return;
    const label='Câu '+cur.no+' ("'+trunc(cur.text.replace(/\s+/g,' '),28)+'")';
    if(!cur.text.trim())errs.push(label+': thiếu nội dung câu hỏi');
    else if(cur.opts.length<2)errs.push(label+': cần ít nhất 2 đáp án A, B');
    else if(cur.opts.length>4)errs.push(label+': tối đa 4 đáp án A-D');
    else if(cur.ans<0||cur.ans>=cur.opts.length)errs.push(label+': thiếu hoặc sai dòng "Đáp án:"');
    else{
      const q=cleanQ({subject:cur.subject,chapter:cur.chapter,lesson:cur.lesson,text:cur.text,options:cur.opts,answer:cur.ans,explain:cur.explain});
      if(q)out.push(q);else errs.push(label+': dữ liệu không hợp lệ');
    }
    cur=null;mode='';
  }
  function start(no,text){
    seen++;
    cur={no:no||seen,text:text||'',opts:[],ans:-1,explain:'',subject:ctx.subject,chapter:ctx.chapter,lesson:ctx.lesson};
    mode='q';
  }
  lines.forEach(line=>{
    if(!line.trim())return;                                   // bỏ dòng trống
    let m=line.match(reHead);
    if(m){                                                    // dòng #Môn / #Chương / #Bài
      flush();const k=fold(m[1]),v=m[2].trim();
      if(k==='mon')ctx.subject=matchSubject(v);
      else if(k==='chuong'){ctx.chapter=v||'Chung';ctx.lesson='';}
      else ctx.lesson=v;
      return;
    }
    /* Trong phần giải thích, "1." hay "A." chỉ là chữ thường; chỉ dòng bắt đầu bằng chữ "Câu" mới mở câu mới */
    if(mode!=='exp'||!cur||/^\s*(?:câu|cau)/i.test(line)){
      m=line.match(reQ);
      if(m){flush();start(m[1],m[2]);return;}                 // dòng "Câu n."
    }
    m=cur&&mode!=='exp'?line.match(/^\s*\*\s*([A-Da-d])\s*$/):null;
    if(m){cur.ans='ABCD'.indexOf(m[1].toUpperCase());mode='ans';return;}   // dòng chỉ ghi "*B" = đáp án đúng
    if(cur&&mode!=='exp'){
      m=line.match(reOpt);
      if(m){                                                  // dòng đáp án A/B/C/D
        cur.opts.push(m[3]);mode='opt';
        if(m[1]==='*')cur.ans=cur.opts.length-1;              // dấu * = đáp án đúng
        return;
      }
    }
    if(cur){
      m=line.match(reAns);
      if(m){cur.ans='ABCD'.indexOf(m[1].toUpperCase());mode='ans';return;}
      m=line.match(reExp);
      if(m){cur.explain=m[1];mode='exp';return;}
    }
    // dòng chữ thường: nối vào phần đang viết dở
    if(!cur){start(null,line);return;}
    if(mode==='q')cur.text+='\n'+line;
    else if(mode==='opt')cur.opts[cur.opts.length-1]+=' '+line.trim();
    else if(mode==='exp')cur.explain+='\n'+line;
    else if(mode==='ans'){flush();start(null,line);}          // câu mới không đánh số
  });
  flush();
  return {out:out,errs:errs};
}

/* parseNotes: đọc văn bản -> {out: danh sách ghi chú, errs: lỗi}
   Mẫu: dòng #Môn #Chương #Bài #Dạng đặt ngữ cảnh; "## Tiêu đề" mở ghi chú mới; "Tóm tắt:", "Ví dụ:", "Mẹo:",
   "Lỗi sai:", "Bài tập:", "Lời giải:" là các nhãn. Dán chữ bình thường (không nhãn): dòng đầu là tiêu đề, còn lại là tóm tắt. */
function parseNotes(raw,def){
  const lines=String(raw).replace(/\r/g,'').split('\n');
  const out=[],errs=[];
  const ctx={subject:def.subject||'Môn khác',chapter:def.chapter||'Chung',lesson:def.lesson||'',type:def.type||''};
  /* [SỬA] Các mẫu nhận dạng dòng */
  const reHead=/^\s*#\s*(môn|mon|chương|chuong|bài|bai|dạng|dang)\s*[:：]\s*(.*)$/i;
  const reTitle=/^\s*(?:##\s*|(?:tiêu đề|tieu de)\s*[:：]\s*)(.+)$/i;
  const reLab=/^\s*(tóm tắt|tom tat|nội dung|noi dung|ví dụ|vi du|mẹo|meo|lỗi sai|loi sai|lỗi thường gặp|loi thuong gap|bài tập mẫu|bai tap mau|bài tập|bai tap|lời giải|loi giai|dạng|dang|từ khóa|tu khoa|tag)\s*[:：]\s*(.*)$/i;
  const MAP={'tom tat':'summary','noi dung':'summary','vi du':'example','meo':'tip','loi sai':'mistake','loi thuong gap':'mistake',
    'bai tap mau':'sample','bai tap':'sample','loi giai':'solution','dang':'type','tu khoa':'tags','tag':'tags'};
  let cur=null,field='summary';
  function flush(){
    if(!cur)return;
    const n=cleanNote(cur);
    if(n)out.push(n);else errs.push('Ghi chú "'+trunc(cur.title,28)+'": thiếu tiêu đề');
    cur=null;
  }
  function start(title){
    flush();
    cur={title:title.trim(),subject:ctx.subject,chapter:ctx.chapter,lesson:ctx.lesson,type:ctx.type,
      summary:'',example:'',tip:'',mistake:'',sample:'',solution:'',tags:''};
    field='summary';
  }
  lines.forEach(line=>{
    if(!line.trim()){if(cur&&cur[field])cur[field]+='\n';return;}
    let m=line.match(reHead);
    if(m){                                   // dòng #Môn / #Chương / #Bài / #Dạng
      flush();const k=fold(m[1]),v=m[2].trim();
      if(k==='mon')ctx.subject=matchSubject(v);
      else if(k==='chuong'){ctx.chapter=v||'Chung';ctx.lesson='';ctx.type='';}
      else if(k==='bai')ctx.lesson=v;
      else ctx.type=v;
      return;
    }
    m=line.match(reTitle);
    if(m){start(m[1]);return;}               // dòng "## Tiêu đề"
    m=line.match(reLab);
    if(m){                                   // dòng có nhãn
      if(!cur)start('Ghi chú '+(out.length+1));
      const f=MAP[fold(m[1])];
      if(f==='type'){cur.type=m[2].trim();return;}
      field=f;cur[f]+=(cur[f]?'\n':'')+m[2];return;
    }
    if(!cur){start(line);return;}            // dán nhanh: dòng đầu là tiêu đề
    cur[field]+=(cur[field]?'\n':'')+line;   // dòng thường: nối vào phần đang viết
  });
  flush();
  return {out:out,errs:errs};
}

  if(!dateStr)return null;
  const a=dateStr.split('-').map(Number);
  const t=new Date(a[0],a[1]-1,a[2]),n=new Date();
  const t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((t-t0)/86400000);
}

function groupBy(list,fn){const m={},ord=[];list.forEach(x=>{const k=fn(x);if(!m[k]){m[k]=[];ord.push(k);}m[k].push(x);});return ord.sort((a,b)=>a.localeCompare(b,'vi',{numeric:true})).map(k=>({k:k,items:m[k]}));}

/* ---------- 3.8 LUYỆN ĐỀ: LÀM BÀI, SỔ CÂU SAI, ĐỀ ĐÃ LƯU, NGÂN HÀNG, THỐNG KÊ ---------- */
function filterPool(o){
  const src=o.mode==='retry'?'wrong':o.source;
  return db.questions.filter(q=>(!o.subject||q.subject===o.subject)&&(!o.chapter||q.chapter===o.chapter)&&
    (!o.lesson||q.lesson===o.lesson)&&(src==='all'||(src==='new'&&!q.last)||(src==='wrong'&&q.wrong)||(src==='hard'&&q.hard)));
}

  $('#page-study').innerHTML='<div class="tabs">'+Object.keys(tabs).map(k=>'<button data-act="stab" data-t="'+k+'" class="'+(studyTab===k?'active':'')+'">'+tabs[k]+'</button>').join('')+'</div><div id="st-body"></div>';
  ({do:renderSetup,log:renderLog,exams:renderExams,bank:renderBank,stats:renderStats})[studyTab]();
}

function readSetup(){
  const o=studyOpts;
  o.count=Math.max(0,parseInt($('#o-count').value,10)||0);
  if($('#o-min'))o.minutes=Math.max(0,parseInt($('#o-min').value,10)||0);
  o.sq=$('#o-sq').checked;o.so=$('#o-so').checked;
}
/* beginFrom: tạo "phiên làm bài" (session) từ danh sách câu hỏi */
function beginFrom(o,poolOverride){
  let pool=poolOverride||filterPool(o);
  if(!pool.length){toast('Chưa có câu hỏi phù hợp');return;}
  if(o.sq)pool=shuffle(pool);
  if(o.count>0)pool=pool.slice(0,o.count);
  session={mode:o.mode,opts:Object.assign({},o),idx:0,finished:false,showGrid:false,startedAt:Date.now(),
    limit:(o.mode==='test'&&o.minutes>0)?o.minutes*60:0,timer:null,result:null,
    items:pool.map(q=>{const idx=q.options.map((_,i)=>i);return {q:q,order:o.so?shuffle(idx):idx,picked:null,done:false};})};
  if(session.mode==='test'||session.limit){session.timer=setInterval(tick,1000);}
  studyTab='do';
  if(location.hash!=='#study')location.hash='#study';else renderStudy();
  window.scrollTo(0,0);
}
function elapsed(){return Math.floor((Date.now()-session.startedAt)/1000);}
function tick(){
  if(!session||session.finished)return;
  if(session.limit&&elapsed()>=session.limit){toast('⏰ Hết giờ! Hệ thống tự nộp bài.');finishSession();return;}
  updateTimer();
}
function updateTimer(){
  const el=$('#timer');if(!el||!session||session.mode!=='test')return;
  el.textContent='⏱ '+(session.limit?mmss(session.limit-elapsed()):mmss(elapsed()));
}
function reasonBox(q){
  return '<label class="f">Vì sao sai? (lưu vào Sổ câu sai)</label><select data-change="q-reason" data-id="'+q.id+'">'+listOptions(REASONS,q.reason,'— chọn lý do —')+'</select>'+
    '<textarea data-change="q-note" data-id="'+q.id+'" style="min-height:60px;margin-top:6px" placeholder="Ghi chú: mình nhầm ở đâu?">'+esc(q.note)+'</textarea>';
}
function renderSession(){
  const S=session,box=$('#page-study');
  if(S.finished){renderResult();return;}
  const it=S.items[S.idx],q=it.q,isTest=S.mode==='test',n=S.items.length;
  let h='<div class="sess-top"><button class="btn small ghost" data-act="exit">✕ Thoát</button>'+
    '<div class="grow"><b>Câu '+(S.idx+1)+'/'+n+'</b> <span class="tag">'+MODE_LABEL[S.mode]+'</span></div><div id="timer" class="timer"></div></div>'+
    '<div class="pbar"><i style="width:'+Math.round((S.idx+1)/n*100)+'%"></i></div>';
  if(S.showGrid){
    h+='<div class="card"><b>Chọn câu:</b><div class="qgrid">'+S.items.map((x,i)=>'<button data-act="jump" data-i="'+i+'" class="'+(x.picked!==null?'done ':'')+(i===S.idx?'cur':'')+'">'+(i+1)+'</button>').join('')+'</div>'+
      '<button class="btn ghost block" data-act="grid">Đóng</button></div>';
  }
  h+='<div class="card"><div class="qmeta">'+subjIcon(q.subject)+' '+esc(q.subject)+' · '+esc(q.chapter)+(q.lesson?' · '+esc(q.lesson):'')+
    (q.hard?' <span class="tag star">⭐ khó</span>':'')+(q.wrong?' <span class="tag wr">từng sai</span>':'')+'</div>'+
    '<div class="qtext">'+esc(q.text)+'</div><div class="opts">';
  it.order.forEach((oi,p)=>{
    let cls='opt';
    if(isTest){if(it.picked===oi)cls+=' sel';}
    else if(it.done){if(oi===q.answer)cls+=' ok';else if(oi===it.picked)cls+=' bad';}
    h+='<button class="'+cls+'" data-act="pick" data-oi="'+oi+'"'+((!isTest&&it.done)?' disabled':'')+'><span class="ltr">'+'ABCD'[p]+'</span><span>'+esc(q.options[oi])+'</span></button>';
  });
  h+='</div>';
  if(!isTest&&it.done){
    const ok=it.picked===q.answer;
    h+='<div class="fb '+(ok?'okbox':'badbox')+'">'+(ok?'✅ Chính xác!':'❌ Chưa đúng. Đáp án đúng: '+'ABCD'[it.order.indexOf(q.answer)])+'</div>'+
       '<div class="explain">💡 '+(q.explain?esc(q.explain):'Câu này chưa có giải thích. Bạn có thể thêm trong Ngân hàng → Sửa.')+'</div>'+(ok?'':reasonBox(q));
  }
  h+='<div class="row" style="margin-top:10px"><button class="btn small '+(q.hard?'on':'line')+'" data-act="hard" data-id="'+q.id+'">⭐ '+(q.hard?'Đã đánh dấu khó':'Đánh dấu câu khó')+'</button></div></div>';
  const last=S.idx===n-1;
  h+='<div class="navrow"><button class="btn line" data-act="prev"'+(S.idx===0?' disabled':'')+'>◀ Trước</button>';
  if(isTest)h+='<button class="btn ghost" data-act="grid">☰ '+S.items.filter(x=>x.picked!==null).length+'/'+n+'</button>';
  h+=last?'<button class="btn" data-act="finish">'+(isTest?'Nộp bài':'Kết thúc')+'</button>':'<button class="btn" data-act="next">Tiếp ▶</button>';
  h+='</div>';
  if(isTest&&!last)h+='<button class="btn line block" style="margin-top:8px" data-act="finish">Nộp bài</button>';
  box.innerHTML=h;updateTimer();
}
function pick(oi){
  const S=session,it=S.items[S.idx];
  if(S.mode==='test'){it.picked=(it.picked===oi)?null:oi;renderSession();return;}
  if(it.done)return;
  it.picked=oi;it.done=true;
  recordAnswer(it.q,oi===it.q.answer,S.mode);
  renderSession();
}
function finishSession(){
  const S=session;if(!S||S.finished)return;
  clearInterval(S.timer);S.finished=true;
  let correct=0,answered=0;
  S.items.forEach(it=>{
    if(it.picked===null)return;
    answered++;
    const ok=it.picked===it.q.answer;if(ok)correct++;
    if(S.mode==='test')recordAnswer(it.q,ok,S.mode);   // kiểm tra: chấm tất cả khi nộp bài
  });
  const total=S.items.length;
  /* [SỬA] Thang điểm: hiện là thang 10. Muốn thang 100 thì đổi *10 thành *100 */
  const score=Math.round(correct/total*10*100)/100;
  S.result={total:total,answered:answered,correct:correct,wrong:answered-correct,skipped:total-answered,score:score,secs:elapsed()};
  if(answered>0){
    db.history.push({t:Date.now(),mode:S.mode,subject:S.opts.subject||'Tất cả môn',total:total,correct:correct,answered:answered,score:score});
    db.history=db.history.slice(-100);save();
  }
  renderStudy();
}
function renderResult(){
  const S=session,r=S.result,isTest=S.mode==='test';
  const bad=S.items.filter(it=>(it.picked!==null&&it.picked!==it.q.answer)||(isTest&&it.picked===null));
  let h='<div class="card" style="text-align:center"><div class="muted">'+MODE_LABEL[S.mode]+' · '+mmss(r.secs)+'</div>'+
    (isTest?'<div class="big">'+r.score+'<span style="font-size:1.1rem">/10</span></div>':'<div class="big">'+r.correct+'/'+r.answered+'</div>')+
    '<p style="margin:6px 0 0">Đúng <b style="color:var(--ok)">'+r.correct+'</b> · Sai <b style="color:var(--bad)">'+r.wrong+'</b> · Bỏ qua <b>'+r.skipped+'</b></p>'+
    '<p class="muted" style="margin:6px 0 0">'+(r.correct===r.total?'Tuyệt vời! 🌟':r.wrong+r.skipped>0?'Xem lại các câu bên dưới và ghi lý do sai nhé.':'')+'</p></div>';
  h+='<div class="grid2"><button class="btn" data-act="redo">🔁 Làm lại</button><button class="btn line" data-act="retry-bad"'+(bad.some(it=>it.picked!==null)?'':' disabled')+'>Luyện câu sai</button></div>'+

        '<div class="explain">💡 '+(q.explain?esc(q.explain):'Chưa có giải thích.')+'</div>'+(it.picked!==null?reasonBox(q):'')+

/* mergeInto: gộp dữ liệu từ file/mạng vào db hiện tại. Trả về chuỗi tóm tắt */
function mergeInto(data){
  const d=normalizeDb(data);
  const a=addQuestions(d.questions),b=addNotes(d.notes);
  addUnique(d.works,db.works,w=>fold(w.title)+'|'+fold(w.author));
  const ids=new Set(db.exams.map(e=>e.id));d.exams.forEach(e=>{if(!ids.has(e.id))db.exams.push(e);});
  const cids=new Set(db.compares.map(e=>e.id));d.compares.forEach(e=>{if(!cids.has(e.id))db.compares.push(e);});
  const seenT=new Set(db.history.map(x=>x.t));
  d.history.forEach(x=>{if(!seenT.has(x.t))db.history.push(x);});
  db.history.sort((x,y)=>x.t-y.t);db.history=db.history.slice(-100);
  Object.keys(d.daily).forEach(k=>{if(!db.daily[k]||db.daily[k].done<d.daily[k].done)db.daily[k]=d.daily[k];});
  save();return a.add+' câu hỏi, '+b.add+' ghi chú mới';
}
/* checkBackup: kiểm tra dữ liệu trước khi khôi phục. Trả về {ok, msg, d} */
function checkBackup(data){
  if(!data||typeof data!=='object'||Array.isArray(data))return {ok:false,msg:'Đây không phải file sao lưu của trang'};
  if(!['questions','notes','works','compares','exams'].some(k=>Array.isArray(data[k])))return {ok:false,msg:'Không thấy câu hỏi hoặc ghi chú trong dữ liệu'};
  const d=normalizeDb(data);
  const bad=(arr(data,'questions').length-d.questions.length)+(arr(data,'notes').length-d.notes.length);
  return {ok:true,d:d,msg:d.questions.length+' câu hỏi, '+d.notes.length+' ghi chú, '+d.works.length+' tác phẩm'+(bad>0?' ('+bad+' mục lỗi sẽ bị bỏ qua)':'')};
}
function restore(text){
  let data;
  try{data=JSON.parse(text);}catch(e){toast('File/nội dung không phải JSON hợp lệ');return;}
  const c=checkBackup(data);
  if(!c.ok){toast(c.msg);return;}
  const mode=($('input[name=bk-mode]:checked')||{}).value||'merge';
  if(mode==='replace'){
    if(!confirm('Dữ liệu sao lưu có: '+c.msg+'.\nThay thế toàn bộ dữ liệu hiện tại? (Máy sẽ tự tạo bản lưu trước.)'))return;
    snapshot('trước khi thay thế');
    const keep={syncUrl:db.settings.syncUrl,syncKey:db.settings.syncKey};
    db=c.d;Object.assign(db.settings,keep);save();toast('Đã khôi phục: '+c.msg);
  }else{snapshot('trước khi gộp');toast('Đã gộp: '+mergeInto(data));}
  renderTools();
}
function notesToText(){
  let out='',ctx='';
  db.notes.slice().sort((a,b)=>(a.subject+a.chapter+a.lesson+a.type).localeCompare(b.subject+b.chapter+b.lesson+b.type,'vi')).forEach(n=>{
    const key=[n.subject,n.chapter,n.lesson,n.type].join('|');
    if(key!==ctx){ctx=key;out+='\n#Môn: '+n.subject+'\n#Chương: '+n.chapter+'\n'+(n.lesson?'#Bài: '+n.lesson+'\n':'')+(n.type?'#Dạng: '+n.type+'\n':'')+'\n';}
    out+='## '+n.title+'\n';
    [['summary','Tóm tắt'],['example','Ví dụ'],['tip','Mẹo'],['mistake','Lỗi sai'],['sample','Bài tập'],['solution','Lời giải'],['tags','Từ khóa']].forEach(f=>{if(n[f[0]])out+=f[1]+': '+n[f[0]]+'\n';});
    out+='\n';
  });
  return out.trim()+'\n';
}

  pick:b=>pick(parseInt(b.dataset.oi,10)),

  unwrong:b=>{const q=db.questions.find(x=>x.id===b.dataset.id);if(q){q.wrong=false;save();renderLog();}},
  hard:b=>{const q=db.questions.find(x=>x.id===b.dataset.id);if(!q)return;q.hard=!q.hard;save();toast(q.hard?'⭐ Đã đánh dấu câu khó':'Đã bỏ đánh dấu');if(session&&!session.finished)renderSession();else route();},
  toggle:b=>{const id=b.dataset.id;if(bankOpen.has(id))bankOpen.delete(id);else bankOpen.add(id);renderBankList();},
  more:()=>{bf.limit+=30;renderBankList();},
  'add-q':()=>openEditor(null),
  'edit-q':b=>openEditor(b.dataset.id),
  'del-q':b=>{if(confirm('Xóa câu hỏi này?')){db.questions=db.questions.filter(x=>x.id!==b.dataset.id);save();toast('Đã xóa');renderBank();}},
  'save-q':b=>saveEditor(b.dataset.id),
  'close-modal':()=>$('#modal').classList.remove('show'),
  'reset-stats':()=>{if(confirm('Xóa toàn bộ thống kê và danh sách câu sai/khó? Câu hỏi vẫn được giữ.')){
    snapshot('trước khi xóa thống kê');
    db.history=[];db.daily={};db.questions.forEach(q=>{q.right=0;q.wrongCount=0;q.wrong=false;q.last=0;q.hard=false;q.reason='';q.note='';});save();renderStats();}},
  /* --- Ngữ văn --- */
  ltab:b=>{litTab=b.dataset.t;renderLit();},
  'add-work':()=>openWorkEditor(null),'edit-work':b=>openWorkEditor(b.dataset.id),'save-work':b=>saveWork(b.dataset.id),
  'del-work':b=>{if(confirm('Xóa tác phẩm này?')){db.works=db.works.filter(x=>x.id!==b.dataset.id);save();renderLit();}},
  wtoggle:b=>{const id=b.dataset.id;if(workOpen.has(id))workOpen.delete(id);else workOpen.add(id);renderLit();},
  'add-cmp':()=>openCmpEditor(null),'edit-cmp':b=>openCmpEditor(b.dataset.id),'save-cmp':b=>saveCmp(b.dataset.id),
  'del-cmp':b=>{if(confirm('Xóa bảng so sánh này?')){db.compares=db.compares.filter(x=>x.id!==b.dataset.id);save();renderLit();}},
  /* --- Thêm: nhập liệu, sao lưu --- */
  tooltab:b=>{toolTab=b.dataset.t;renderTools();},
  ikind:b=>{impKind=b.dataset.k;importText='';renderTools();},
  'imp-sample':()=>{importText=impKind==='q'?SAMPLE_TEXT:SAMPLE_NOTES;$('#i-text').value=importText;},
  'imp-paste':()=>{
    if(!navigator.clipboard||!navigator.clipboard.readText){toast('Máy không cho đọc clipboard, hãy nhấn giữ vào ô và chọn Dán');return;}
    navigator.clipboard.readText().then(t=>{$('#i-text').value=t;importText=t;toast('Đã dán');}).catch(()=>toast('Không đọc được clipboard, hãy nhấn giữ vào ô và chọn Dán'));
  },
  'imp-preview':()=>{
    const r=readImport(),box=$('#i-result'),isQ=impKind==='q';
    let h='<div class="'+(r.errs.length?'warn':'fb okbox')+'">Đọc được <b>'+r.out.length+'</b> '+(isQ?'câu':'ghi chú')+' hợp lệ'+(r.errs.length?', <b>'+r.errs.length+'</b> lỗi':'')+'.</div>';
    if(r.errs.length)h+='<ul>'+r.errs.slice(0,15).map(e=>'<li>'+esc(e)+'</li>').join('')+(r.errs.length>15?'<li>... và '+(r.errs.length-15)+' lỗi nữa</li>':'')+'</ul>';
    r.out.slice(0,3).forEach(q=>{h+='<div class="card" style="margin-top:8px"><div class="qmeta">'+esc(q.subject)+' · '+esc(q.chapter)+(q.lesson?' · '+esc(q.lesson):'')+(q.type?' · '+esc(q.type):'')+'</div><b>'+esc(trunc(isQ?q.text:q.title,100))+'</b>'+
      (isQ?q.options.map((o,i)=>'<div'+(i===q.answer?' style="color:var(--ok);font-weight:700"':'')+'>'+'ABCD'[i]+'. '+esc(o)+'</div>').join(''):'<div class="muted">'+esc(trunc(q.summary,120))+'</div>')+'</div>';});
    if(r.out.length>3)h+='<p class="muted">... và '+(r.out.length-3)+' mục nữa</p>';
    box.innerHTML=h;
  },
  'imp-add':()=>{
    const r=readImport(),isQ=impKind==='q';
    if(!r.out.length){toast('Chưa có mục hợp lệ. Bấm "Xem trước" để xem lỗi');actions['imp-preview']();return;}
    const a=isQ?addQuestions(r.out):addNotes(r.out);
    toast('Đã thêm '+a.add+(isQ?' câu':' ghi chú')+(a.dup?', bỏ qua '+a.dup+' trùng':'')+(r.errs.length?', '+r.errs.length+' lỗi':''));
    if(!r.errs.length){importText='';$('#i-text').value='';$('#i-result').innerHTML='';}else actions['imp-preview']();
  },
  'bk-down':()=>{download('so-tay-backup-'+todayStr()+'.json',JSON.stringify(db,null,1));db.settings.lastBackup=Date.now();save();toast('Đã tải file sao lưu');renderTools();},
  'bk-notes':()=>{if(!db.notes.length){toast('Chưa có ghi chú');return;}download('ghi-chu-'+todayStr()+'.txt',notesToText(),'text/plain');toast('Đã tải ghi chú');},
  'bk-copy':()=>{copyText(JSON.stringify(db)).then(()=>{db.settings.lastBackup=Date.now();save();toast('Đã sao chép. Hãy dán vào ghi chú/Zalo để lưu');}).catch(()=>toast('Không sao chép được, hãy dùng nút Tải file'));},
  'bk-paste':()=>restore($('#bk-text').value),
  'snap-now':()=>{toast(snapshot('tạo thủ công')?'Đã tạo bản lưu':'Không tạo được bản lưu (hết chỗ)');renderTools();},
  'snap-restore':b=>{
    const s=getSnaps()[parseInt(b.dataset.i,10)];if(!s)return;
    let data;try{data=JSON.parse(s.data);}catch(e){toast('Bản lưu bị hỏng');return;}
    const c=checkBackup(data);if(!c.ok){toast(c.msg);return;}
    if(!confirm('Quay về bản lưu lúc '+fmtDate(s.t)+' ('+c.msg+')?\nDữ liệu hiện tại sẽ được lưu thành bản mới trước.'))return;
    snapshot('trước khi quay về bản cũ');
    const keep={syncUrl:db.settings.syncUrl,syncKey:db.settings.syncKey};
    db=c.d;Object.assign(db.settings,keep);save();toast('Đã quay về bản lưu');renderTools();
  },
  wipe:()=>{if(confirm('Xóa TẤT CẢ dữ liệu? Máy sẽ tạo bản lưu trước.')&&confirm('Chắc chắn xóa?')){
    snapshot('trước khi xóa tất cả');const keep=db.settings;db=emptyDb();db.settings=keep;save();toast('Đã xóa');route();}},
  'sy-up':()=>{
    const u=syncUrl();if(!u)return;const st=$('#sy-status');st.textContent='Đang tải lên...';
    fetch(u,{method:'POST',body:JSON.stringify(db)}).then(r=>r.text()).then(t=>{st.textContent=t.trim()==='ok'?'✅ Đã tải lên '+fmtDate(Date.now()):'Máy chủ trả lời: '+trunc(t,80);})
      .catch(()=>{st.textContent='❌ Không kết nối được. Kiểm tra URL, quyền "Bất kỳ ai", hoặc dùng sao lưu file.';});
  },
  'sy-down':()=>{
    const u=syncUrl();if(!u)return;const st=$('#sy-status');st.textContent='Đang tải về...';
    fetch(u).then(r=>r.json()).then(d=>{if(d.error){st.textContent='❌ Sai khóa (KEY)';return;}snapshot('trước khi tải về');st.textContent='✅ Đã gộp: '+mergeInto(d);})
      .catch(()=>{st.textContent='❌ Không tải được. Kiểm tra URL/khóa hoặc dùng sao lưu file.';});
  }
};
const changes={
  exam:()=>{db.settings.examName=$('#ex-name').value.trim();db.settings.examDate=$('#ex-date').value;save();renderHome();},
  'nf-subject':el=>{nf.subject=el.value;nf.chapter='';nf.type='';renderNotes();},
  'nf-chapter':el=>{nf.chapter=el.value;renderNotes();},
  'nf-type':el=>{nf.type=el.value;renderNotes();},
  'fl-subject':el=>{flSubj=el.value;renderReview();},
  'so-subject':el=>{readSetup();studyOpts.subject=el.value;studyOpts.chapter='';studyOpts.lesson='';renderStudy();},
  'so-chapter':el=>{readSetup();studyOpts.chapter=el.value;studyOpts.lesson='';renderStudy();},
  'so-lesson':el=>{readSetup();studyOpts.lesson=el.value;renderStudy();},
  'so-source':el=>{readSetup();studyOpts.source=el.value;renderStudy();},
  'q-reason':el=>{const q=db.questions.find(x=>x.id===el.dataset.id);if(q){q.reason=el.value;save();}},
  'q-note':el=>{const q=db.questions.find(x=>x.id===el.dataset.id);if(q){q.note=el.value.trim();save();}},
  'log-subject':el=>{logSubj=el.value;renderLog();},
  'bf-subject':el=>{bf.subject=el.value;bf.chapter='';bf.lesson='';bf.limit=30;renderBank();},
  'bf-chapter':el=>{bf.chapter=el.value;bf.lesson='';bf.limit=30;renderBank();},
  'bf-lesson':el=>{bf.lesson=el.value;bf.limit=30;renderBank();},
  'bf-flag':el=>{bf.flag=el.value;bf.limit=30;renderBank();},
  'imp-def':()=>{importDef={subject:$('#i-subject').value,chapter:$('#i-chapter').value.trim(),lesson:$('#i-lesson').value.trim(),type:$('#i-type')?$('#i-type').value.trim():importDef.type};},
  'bk-file':el=>{
    const f=el.files&&el.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>restore(String(rd.result));rd.onerror=()=>toast('Không đọc được file');rd.readAsText(f);
  }
};
const inputs={
  nq:el=>{nf.q=el.value;renderNoteList();},                   // gõ tới đâu lọc tới đó
  bq:el=>{bf.q=el.value;bf.limit=30;renderBankList();},
  wq:el=>{wq.q=el.value;const k=fold(wq.q);$('#w-list').innerHTML=workList(db.works.filter(w=>!k||fold(WORK_F.map(f=>w[f]).join(' ')).indexOf(k)>=0));},
  'imp-text':el=>{importText=el.value;}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&actions[b.dataset.act])actions[b.dataset.act](b,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&changes[el.dataset.change])changes[el.dataset.change](el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&inputs[el.dataset.input])inputs[el.dataset.input](el,e);});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show');}); // bấm ra ngoài để đóng
window.addEventListener('hashchange',route);
RENDER={home:renderHome,notes:renderNotes,review:renderReview,study:renderStudy,lit:renderLit,tools:renderTools};

/* ---------- KHỞI ĐỘNG ---------- */
load();
route();
setInterval(()=>{if((location.hash==='#home'||!location.hash)&&(!document.activeElement||document.activeElement.tagName!=='INPUT'))renderHome();},60000);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){} // xin trình duyệt giữ dữ liệu lâu dài
})();
</script>
</body>
</html>
